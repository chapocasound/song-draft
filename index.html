<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Draft songs, artists or albums with friends and score by Spotify streams.">
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<title>Song Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
body{margin:0}
/* Layout: single centered column; a sticky room bar on top, the current phase as the main panel, standings below. */
:root{
  --bg:#EEF0F5; --surface:#FFFFFF; --sunk:#E3E6EE; --ink:#161A2B; --muted:#5B6178; --line:#D3D8E4;
  --accent:#2F4BFF; --accent-ink:#FFFFFF; --flag:#C92A62; --flag-soft:#F8DDE7; --good:#167A4C; --good-soft:#D9F0E4;
  --f-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1220; --surface:#181C2E; --sunk:#12162A; --ink:#E9ECF6; --muted:#9AA1BC; --line:#2A3049;
  --accent:#8291FF; --accent-ink:#0F1220; --flag:#FF7BA6; --flag-soft:#3A1C2A; --good:#5AD596; --good-soft:#173527; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1220; --surface:#181C2E; --sunk:#12162A; --ink:#E9ECF6; --muted:#9AA1BC; --line:#2A3049;
  --accent:#8291FF; --accent-ink:#0F1220; --flag:#FF7BA6; --flag-soft:#3A1C2A; --good:#5AD596; --good-soft:#173527; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:18px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;margin-right:auto}
.brand span{color:var(--accent)}
.code{font-family:var(--f-num);font-weight:600;letter-spacing:.18em;background:var(--sunk);padding:3px 10px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
h2{font-size:22px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:10px}
label{font-size:13px;font-weight:600;display:grid;gap:5px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
button,.btn{font:inherit;font-weight:600;border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.5;cursor:not-allowed}
button.flag{border-color:var(--line);color:var(--muted);padding:5px 10px;font-size:13px}
button.flag.on{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.small{font-size:13px}
.err{color:var(--flag);font-size:13px;font-weight:600}
.banner{background:var(--sunk);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px}
.banner .cat{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.01em;text-wrap:balance}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.turn{background:var(--accent);color:var(--accent-ink)}
.pill.done{background:var(--good-soft);color:var(--good)}
.pill.zero{background:var(--flag-soft);color:var(--flag)}
.players{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:14px}
.chip.me{border-color:var(--accent)}
.board{display:grid;gap:6px}
.slot{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;border:1px solid var(--line)}
.slot.next{border-color:var(--accent);border-style:dashed}
.slot .tag{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.slot .who{font-size:12px;color:var(--muted)}
.slot .ans{font-weight:600;overflow-wrap:anywhere}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600}
.hide{letter-spacing:.2em;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.col{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;align-content:start;min-width:0}
.col.win{border-color:var(--good);background:var(--good-soft)}
.line{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.line .a{min-width:0;overflow-wrap:anywhere}
.struck{text-decoration:line-through;color:var(--muted)}
.total{border-top:1px solid var(--line);padding-top:8px;font-family:var(--f-num);font-weight:600;font-size:18px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.note{font-size:13px;color:var(--muted)}
.opts{display:grid;gap:4px;max-height:320px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:4px}
.opt{display:grid;gap:1px;justify-items:start;text-align:left;white-space:normal;border:0;border-radius:6px;padding:7px 10px;font-weight:500}
.opt:hover{background:var(--sunk)}
.opt.on{background:var(--accent);color:var(--accent-ink)}
.opt .ot{font-weight:600;overflow-wrap:anywhere}
.opt .os{font-size:12px;opacity:.75}
.src{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.reveal .num{animation:pop .5s ease-out both}@keyframes pop{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>

<div class="bar"><div class="bar-in">
  <div class="brand">Song <span>Draft</span></div>
  <div id="barRoom"></div>
</div></div>
<main class="wrap" id="app">
  <section class="panel"><h2>Loading the room…</h2><p class="muted">Connecting to the shared game board.</p></section>
</main>

<script>
(function(){
const METRICS = {
  songs:{label:"Spotify plays", noun:"song"},
  artists:{label:"Monthly listeners", noun:"artist"},
  albums:{label:"Album streams", noun:"album"},
  custom:{label:"Custom number", noun:"answer"}
};
const POOL = [
  ["Songs with a month in the title","songs"],
  ["Artists with John, Johnny, Johnson or Jonathan in their name","artists"],
  ["Bands with both male and female lead vocalists","artists"],
  ["Albums released in the 2000s","albums"],
  ["Songs with a color in the title","songs"],
  ["Songs with a day of the week in the title","songs"],
  ["Songs with a number in the title","songs"],
  ["Songs with a city in the title","songs"],
  ["Songs with a question mark in the title","songs"],
  ["Christmas songs","songs"],
  ["Songs from movie soundtracks","songs"],
  ["Duets between two solo artists","songs"],
  ["Songs released before 1980","songs"],
  ["Songs with a woman's name in the title","songs"],
  ["Songs with 'Love' in the title","songs"],
  ["Rappers with 'Lil' in their name","artists"],
  ["Artists from Canada","artists"],
  ["One-word artist names","artists"],
  ["Bands with a number in their name","artists"],
  ["Debut albums","albums"],
  ["Self-titled albums","albums"],
  ["Albums with a person's name in the title","albums"],
  ["Live albums","albums"],
  ["Albums released in the 1990s","albums"]
];

/* ---------- stream-count dataset (Kworb snapshot, published beside the page) ---------- */
const DSTOP = new Set(["the","a","an","of","and","feat","ft","with","from","version","remastered","remaster","edit","mix","remix","live","de","la","el","en","y","to","in","on","for","is","my","me","you","i"]);
const QSTOP = new Set([...DSTOP,"o","os","as","e","do","da","dos","das","um","uma","no","na","los","las","le","les","del","al"]);
const toks = s => String(s||"").toLowerCase().replace(/([a-z0-9])!(?=[a-z0-9])/g,"$1i").replace(/\$/g,"s").replace(/@/g,"a").normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/[^\x00-\x7f]/g,"").replace(/[^a-z0-9 ]+/g," ").split(" ").filter(Boolean);
const DATA = {meta:null, shards:{}, artists:null, ver:"4"};
async function loadJSON(path){ const r = await fetch(path+"?v="+DATA.ver); if(!r.ok) throw new Error("Couldn't load "+path); return r.json(); }
async function dataMeta(){ if(!DATA.meta) DATA.meta = await loadJSON("data/meta.json"); return DATA.meta; }
const baseTitle = t => String(t).replace(/\s+[-–—]\s+.*$/,"").replace(/\s*[(\[].*$/,"").trim() || String(t);
function shardOf(tok, n){ return (tok.charCodeAt(0)*131 + tok.charCodeAt(1)) % n; }
// typo-tolerant word match: exact for short words, 1 edit from 4 letters, 2 edits from 8
function near(a,b){
  if(a===b) return 0;
  const m = Math.min(a.length,b.length), max = m>=8?2:(m>=4?1:0);
  if(!max || Math.abs(a.length-b.length)>1) return 99;
  let prev = Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){
    const cur=[i]; let rowMin=i;
    for(let j=1;j<=b.length;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); if(cur[j]<rowMin) rowMin=cur[j]; }
    if(rowMin>max) return 99; prev=cur;
  }
  return prev[b.length]<=max ? prev[b.length] : 99;
}
const best = (t, list) => list.reduce((m,w)=>Math.min(m,near(t,w)),99);
function mkRec(label, sub, value, id){
  const lt = toks(label), at = toks(String(sub).replace(/^feat\. /,""));
  const tk = lt.concat(at); if(lt.length>1) tk.push(lt.join("")); if(at.length>1) tk.push(at.join(""));
  return {label, sub, value, id, tk, bt: sub==="" ? lt : toks(baseTitle(label))};
}
// cost of a record for the typed words, or 99 when it doesn't qualify.
// Every meaningful word of the title (or artist name) has to be typed, in any order, with small typos allowed,
// and every typed word has to belong to the title or artist. Partial words never browse the list.
function matchCost(r, q){
  const qq = q.filter(t=>!QSTOP.has(t)); if(!qq.length) return 99;
  const core = r.bt.filter(t=>!QSTOP.has(t)), need = core.length ? core : r.bt; if(!need.length) return 99;
  let cost = 0;
  const joined = qq.join("")===need.join("") ? 0 : 99;
  let needCost = 0;
  for(const t of need){ const c = best(t, q); if(c===99){ needCost=99; break; } needCost+=c; }
  if(needCost===99 && joined===99) return 99;
  cost += Math.min(needCost, joined);
  for(const t of qq){ const c = best(t, r.tk); if(c===99) return 99; cost+=c; }
  return cost;
}
async function searchData(metric, query){
  const q = toks(query); if(!q.length) return [];
  const qq = q.filter(t=>!QSTOP.has(t)&&t.length>=2);
  if(!qq.length) return [];
  let rows;
  if(metric==="artists"){
    if(!DATA.artists) DATA.artists = (await loadJSON("data/artists.json")).map(r=>mkRec(r[0],"",r[1],"ar:"+r[2]));
    rows = DATA.artists;
  } else {
    const meta = await dataMeta(), dir = metric==="albums" ? "l" : "s";
    const keys = qq.slice().sort((a,b)=>b.length-a.length).slice(0,2);
    if(qq.length>1) keys.push(qq.join(""));
    const shs = [...new Set(keys.map(t=>shardOf(t, meta.nshard)))];
    const seen = new Set(); rows = [];
    for(const sh of shs){
      const k = dir+sh;
      if(!DATA.shards[k]) DATA.shards[k] = (await loadJSON("data/"+dir+"/"+sh+".json")).map(r=>mkRec(r[0],r[1],r[2],(dir==="l"?"al:":"tr:")+r[0]+"|"+r[1]));
      for(const r of DATA.shards[k]) if(!seen.has(r.id)){ seen.add(r.id); rows.push(r); }
    }
  }
  const hits = [];
  for(const r of rows){ const c = matchCost(r,q); if(c<99) hits.push([c,r]); }
  // rank by how closely the words match, never by streams (that would give the answer away)
  hits.sort((a,b)=>a[0]-b[0] || a[1].label.length-b[1].label.length || a[1].label.localeCompare(b[1].label));
  return hits.slice(0,12).map(h=>h[1]);
}

const S = {db:null,user:null,me:null,canWrite:null,code:null,game:null,members:[],picks:[],flags:[],reviews:[],cats:[],unsubs:[],busy:false,msg:"",ready:false};
const $app = document.getElementById("app");
const $bar = document.getElementById("barRoom");

const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").toLowerCase().normalize("NFKD").replace(/[^a-z0-9]/g,"");
const fmt = n => (Math.round(n)||0).toLocaleString("en-US");
function parseNum(raw){
  const s = String(raw||"").trim().toLowerCase().replace(/[\s,_]/g,"");
  const m = s.match(/^(\d+(?:\.\d+)?)([kmb])?$/);
  if(!m) return null;
  const mult = {k:1e3,m:1e6,b:1e9}[m[2]]||1;
  return Math.round(parseFloat(m[1])*mult);
}
const ls = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const nickOf = uid => (S.members.find(m=>m.uid===uid)||{}).nick || "Player";
const metricLabel = cat => cat ? (cat.metric==="custom" ? (cat.customLabel||"Custom number") : METRICS[cat.metric].label) : "";


/* ---------- peer-to-peer room: the host's browser keeps the game, others connect to it ---------- */
const BROKER = new URLSearchParams(location.search).get("broker") || "wss://broker.emqx.io:8084/mqtt";
const TOPIC = code => "songdraft-chapoca/v2/"+code;
const clone = v => v==null ? v : JSON.parse(JSON.stringify(v));
const NET = {client:null, host:false, code:null, token:null, store:{}, subs:new Set(), pending:new Map(), seq:0, status:"", done:new Set(), lastOps:[], hostOnline:null};
const nlog = (...a) => { try{ console.log("[songdraft]",...a); }catch(e){} };
function netEmit(){ NET.subs.forEach(f=>{ try{ f(); }catch(e){} }); }
function applyOp(op){
  if(op.kind==="set") NET.store[op.path]=op.data;
  else if(op.kind==="update") NET.store[op.path]=Object.assign({},NET.store[op.path]||{},op.data);
  else if(op.kind==="delete") delete NET.store[op.path];
}
function mqttOpts(extra){ return Object.assign({clientId:"sd_"+Math.random().toString(36).slice(2,12), clean:true, connectTimeout:8000, reconnectPeriod:2000, keepalive:20}, extra||{}); }
function publishState(){
  ls.set("sd-store-"+NET.code, JSON.stringify(NET.store));
  const c=NET.client; if(!c || !c.connected) return;
  c.publish(TOPIC(NET.code)+"/state", JSON.stringify({store:NET.store, ops:NET.lastOps, at:Date.now()}), {qos:1, retain:true});
}
function announceHost(){ const c=NET.client; if(c && c.connected) c.publish(TOPIC(NET.code)+"/host", JSON.stringify({token:NET.token, at:Date.now()}), {qos:1, retain:true}); }
function hostBroadcast(){ publishState(); netEmit(); }
function netReset(){
  const c=NET.client; NET.client=null;
  try{ c && c.end(true); }catch(e){}
  NET.host=false; NET.code=null; NET.token=null; NET.store={}; NET.status=""; NET.hostOnline=null; NET.done=new Set(); NET.lastOps=[];
  NET.pending.forEach(p=>p.reject({message:"Disconnected."})); NET.pending.clear();
}
// the host closing the room on purpose: clear it on the server so the code is free again
function netClose(){
  const c=NET.client;
  if(NET.host && c && c.connected){
    const T=TOPIC(NET.code);
    try{ c.publish(T+"/state","",{qos:1,retain:true}); c.publish(T+"/host","",{qos:1,retain:true},()=>{ try{ c.end(); }catch(e){} }); }catch(e){}
    NET.client=null;
  }
  netReset();
}
function hostRoom(code){
  netReset(); NET.code=code; NET.host=true;
  const saved = ls.get("sd-host-"+code);
  NET.token = saved || Math.random().toString(36).slice(2,12);
  NET.store = {};
  if(saved){ try{ NET.store = JSON.parse(ls.get("sd-store-"+code)||"null")||{}; }catch(e){} }
  return new Promise((resolve,reject)=>{
    if(typeof mqtt==="undefined") return reject({message:"The connection library didn't load. Check your internet and reload."});
    const T=TOPIC(code);
    const c = mqtt.connect(BROKER, mqttOpts({will:{topic:T+"/host", payload:"", qos:1, retain:true}}));
    NET.client=c;
    let settled=false, ready=false, otherHost=false, retained=null;
    const t = setTimeout(()=>{ if(settled) return; settled=true; if(NET.client===c) netReset(); else try{ c.end(true); }catch(e){} reject({message:"Couldn't reach the game server. Check your internet and try again."}); },15000);
    c.on("connect",()=>{
      nlog("host connected");
      if(NET.client!==c) return;
      NET.status=""; netEmit();
      c.subscribe([T+"/host",T+"/op",T+"/state"],{qos:1});
      if(ready){ announceHost(); publishState(); return; }
      setTimeout(()=>{
        if(settled || NET.client!==c) return;
        if(otherHost){ settled=true; clearTimeout(t); netReset(); return reject({message:"already-hosted"}); }
        if(saved && !Object.keys(NET.store).length && retained) NET.store = retained;
        ready=true; settled=true; clearTimeout(t);
        ls.set("sd-host-"+code, NET.token);
        announceHost(); publishState(); resolve(); netEmit();
      },1500);
    });
    c.on("message",(topic,payload)=>{
      if(NET.client!==c) return;
      const txt = payload.toString();
      if(topic===T+"/host"){ if(!ready && txt){ try{ if(JSON.parse(txt).token!==NET.token) otherHost=true; }catch(e){} } return; }
      if(topic===T+"/state"){ if(!ready && txt){ try{ retained = JSON.parse(txt).store||null; }catch(e){} } return; }
      if(topic===T+"/op" && ready){
        let m; try{ m=JSON.parse(txt); }catch(e){ return; }
        if(!m || !m.id || !m.op || NET.done.has(m.id)) return;
        NET.done.add(m.id); NET.lastOps.push(m.id); if(NET.lastOps.length>80) NET.lastOps.shift();
        applyOp(m.op); hostBroadcast();
      }
    });
    c.on("offline",()=>{ if(NET.client===c){ NET.status="Reconnecting to the game server…"; netEmit(); } });
    c.on("error",e=>nlog("host error", e && e.message));
  });
}
function joinNet(code){
  netReset(); NET.code=code;
  return new Promise((resolve,reject)=>{
    if(typeof mqtt==="undefined") return reject({message:"The connection library didn't load. Check your internet and reload."});
    const T=TOPIC(code); let done=false;
    const c = mqtt.connect(BROKER, mqttOpts()); NET.client=c;
    const fail = msg => { if(done) return; done=true; clearTimeout(timer); if(NET.client===c) netReset(); else try{ c.end(true); }catch(e){} reject({message:msg}); };
    let timer = setTimeout(()=>fail("Couldn't reach the game server. Check your internet and try again."),15000);
    const offlineMsg = "The host is offline. Waiting for them to come back…";
    c.on("connect",()=>{
      nlog("guest connected");
      if(NET.client!==c) return;
      NET.status = NET.hostOnline===false ? offlineMsg : ""; netEmit();
      c.subscribe([T+"/state",T+"/host"],{qos:1},err=>{
        if(err) return fail("Couldn't open room "+code+". Try again.");
        if(!done){ clearTimeout(timer); timer=setTimeout(()=>fail("Room "+code+" isn't open. Check the code, and make sure the host still has the game open."),6000); }
      });
    });
    c.on("message",(topic,payload)=>{
      if(NET.client!==c) return;
      const txt = payload.toString();
      if(topic===T+"/host"){ NET.hostOnline = !!txt; NET.status = NET.hostOnline ? "" : offlineMsg; netEmit(); return; }
      if(topic===T+"/state"){
        if(!txt){ if(!done) fail("Room "+code+" isn't open. Check the code, and make sure the host still has the game open."); return; }
        let m; try{ m=JSON.parse(txt); }catch(e){ return; }
        NET.store = m.store||{};
        (m.ops||[]).forEach(id=>{ const p=NET.pending.get(id); if(p){ NET.pending.delete(id); p.resolve(); } });
        if(!done){ done=true; clearTimeout(timer); resolve(); }
        netEmit();
      }
    });
    c.on("offline",()=>{ if(NET.client===c && done){ NET.status="Reconnecting to the game server…"; netEmit(); } });
    c.on("error",e=>nlog("guest error", e && e.message));
  });
}
function netWrite(op){
  if(NET.host){ applyOp(op); hostBroadcast(); return Promise.resolve(); }
  return new Promise((resolve,reject)=>{
    const c=NET.client;
    if(!c || !c.connected) return reject({message:"Not connected right now. Wait a moment and try again."});
    if(NET.hostOnline===false) return reject({message:"The host is offline, so nothing can change until they're back."});
    const id = S.me+"-"+Date.now().toString(36)+"-"+(++NET.seq);
    NET.pending.set(id,{resolve,reject});
    c.publish(TOPIC(NET.code)+"/op", JSON.stringify({id,op}), {qos:1});
    setTimeout(()=>{ if(NET.pending.has(id)){ NET.pending.delete(id); reject({message:"The host didn't answer. Make sure the host still has the game open, then try again."}); } },10000);
  });
}
const netDb = {
  doc: path => ({
    get: async () => { const v=NET.store[path]; return {exists:!!v, data:()=>clone(v)}; },
    set: d => netWrite({kind:"set",path,data:clone(d)}),
    update: d => netWrite({kind:"update",path,data:clone(d)}),
    delete: () => netWrite({kind:"delete",path}),
    onSnapshot: cb => { const f=()=>{ const v=NET.store[path]; cb({exists:!!v, data:()=>clone(v)}); }; NET.subs.add(f); setTimeout(f,0); return ()=>NET.subs.delete(f); }
  }),
  collection: col => ({ where: (k,op,v) => ({ onSnapshot: cb => {
    const f=()=>cb({docs:Object.keys(NET.store).filter(p=>p.startsWith(col+"/") && NET.store[p] && NET.store[p][k]===v).map(p=>({id:p.slice(col.length+1), data:()=>clone(NET.store[p])}))});
    NET.subs.add(f); setTimeout(f,0); return ()=>NET.subs.delete(f);
  } }) })
};

/* ---------- derived game state ---------- */
function derive(){
  const g = S.game; if(!g) return {phase:"none"};
  const order = g.order||[], n = order.length, c = g.cat||0;
  const inGame = order.includes(S.me);
  if(g.status==="lobby") return {phase:"lobby",order,n,c,inGame};
  if(g.status==="ended") return {phase:"ended",order,n,c,inGame};
  const cat = S.cats.find(x=>x.c===c);
  const setter = n ? order[c % n] : null;
  if(!cat) return {phase:"setting",order,n,c,inGame,setter};
  const picks = S.picks.filter(p=>p.cat===c).sort((a,b)=>a.slot-b.slot);
  const total = n*cat.rounds, R = cat.rounds, cr = Math.min(g.round||0, R-1);
  const turnOf = slot => { const r=Math.floor(slot/n), pos=slot%n, idx = r%2 ? n-1-pos : pos; return order[(idx + c) % n]; };
  const base = {order,n,c,inGame,setter,cat,picks,total,turnOf,R,cr};
  if(picks.length < (cr+1)*n) return Object.assign(base,{phase:"drafting",slot:picks.length,turn:turnOf(picks.length)});
  const reviewed = order.filter(u=>S.reviews.some(x=>x.cat===c && (x.round||0)===cr && x.uid===u));
  const revealed = g.forceReveal===c+":"+cr || reviewed.length===n;
  const rp = picks.filter(p=>Math.floor(p.slot/n)===cr);
  return Object.assign(base,{phase:!revealed?"review":(cr===R-1?"reveal":"roundReveal"),reviewed,rp});
}
function flagCount(c,slot){ return S.flags.filter(f=>f.cat===c && f.slot===slot).length; }
function isZeroed(c,slot,n){ return flagCount(c,slot)*2 > (n-1); }
function scoreCat(c,order,upTo){
  const n = order.length, sums = {}; order.forEach(u=>sums[u]=0);
  S.picks.filter(p=>p.cat===c && (upTo==null || Math.floor(p.slot/n)<=upTo)).forEach(p=>{ if(!(p.uid in sums)) sums[p.uid]=0; if(!isZeroed(c,p.slot,n)) sums[p.uid]+= (p.value||0); });
  const best = Math.max(0,...Object.values(sums));
  const winners = best>0 ? Object.keys(sums).filter(u=>sums[u]===best) : [];
  return {sums,winners};
}
function standings(d){
  const g = S.game, order = g.order||[];
  const done = S.cats.filter(x=>x.c < (g.cat||0) || (d.phase==="reveal" && x.c===g.cat)).sort((a,b)=>a.c-b.c);
  const rows = {}; order.forEach(u=>rows[u]={uid:u,wins:0,total:0});
  done.forEach(cat=>{ const s = scoreCat(cat.c,order); Object.keys(s.sums).forEach(u=>{ if(!rows[u]) rows[u]={uid:u,wins:0,total:0}; rows[u].total+=s.sums[u]; }); s.winners.forEach(u=>rows[u].wins++); });
  return {done, rows:Object.values(rows).sort((a,b)=>b.wins-a.wins || b.total-a.total)};
}

/* ---------- writes ---------- */
async function act(fn){
  if(S.busy) return; S.busy=true; S.msg=""; render();
  try{ await fn(); }catch(e){ S.msg = (e && e.message) || "Something went wrong. Try again."; }
  S.busy=false; render();
}
const gameRef = () => S.db.doc("games/"+S.code);

function genCode(){ const a="ABCDEFGHJKLMNPQRSTUVWXYZ"; let s=""; for(let i=0;i<4;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; }

async function createRoom(nick){
  let code, tries=0;
  for(;;){
    code = genCode();
    try{ await hostRoom(code); break; }
    catch(e){ if(e.message!=="already-hosted" || ++tries>=4) throw e; }
  }
  await S.db.doc("games/"+code).set({host:S.me,status:"lobby",order:[],cat:0,round:0,forceReveal:-1,createdAt:Date.now()});
  await joinRoom(code,nick);
}
async function joinRoom(code,nick){
  code = code.toUpperCase().replace(/[^A-Z]/g,"");
  if(!(NET.code===code && (NET.host || NET.client))){
    try{ await joinNet(code); }catch(e){ throw e; }
  }
  const snap = await S.db.doc("games/"+code).get();
  if(!snap.exists){ throw {message:"No room with code "+code+". Check the code and try again."}; }
  ls.set("sd-nick",nick); ls.set("sd-room-"+code,"1");
  await S.db.doc("members/"+code+"_"+S.me).set({game:code,uid:S.me,nick,joinedAt:Date.now()});
  enter(code);
}
function enter(code){
  S.unsubs.forEach(u=>u()); S.unsubs=[];
  S.code=code; S.game=null; S.members=[];S.picks=[];S.flags=[];S.reviews=[];S.cats=[];
  if(location.hash!=="#"+code) location.hash=code;
  const err = e => { S.msg = "Lost connection to the room ("+(e&&e.code||"error")+"). Reload the page."; render(); };
  S.unsubs.push(gameRef().onSnapshot(s=>{ S.game = s.exists ? s.data() : null; S.ready=true; scheduleRender(); }, err));
  ["members","picks","flags","reviews","cats"].forEach(col=>{
    S.unsubs.push(S.db.collection(col).where("game","==",code).onSnapshot(q=>{ S[col]=q.docs.map(d=>Object.assign({id:d.id},d.data())); scheduleRender(); }, err));
  });
  render();
}
function leave(){ S.unsubs.forEach(u=>u()); S.unsubs=[]; if(S.code){ try{ localStorage.removeItem("sd-host-"+S.code); localStorage.removeItem("sd-room-"+S.code); }catch(e){} } netClose(); S.code=null; S.game=null; history.replaceState(null,"",location.pathname+location.search); render(); }

      return `<div class="col ${final&&s.winners.includes(u)?"win":""}"><h3>${esc(nickOf(u))}</h3>${ps.map(p=>{const z=isZeroed(d.c,p.slot,d.n), now=Math.floor(p.slot/d.n)===d.cr;return `<div class="line"><span class="a ${z?"struck":""}">${now&&!final?"<b>":""}${esc(p.answer)}${now&&!final?"</b>":""}${p.manual?' <span class="pill">typed in</span>':""}</span><span class="num small ${z?"struck":""}">${fmt(p.value)}</span></div>${z?'<span class="pill zero">Zeroed by the room</span>':""}`;}).join("")}<div class="line total"><span>Total</span><span class="num">${fmt(s.sums[u]||0)}</span></div></div>`;}).join("")}</div>
    ${d.inGame&&!final?`<div class="row"><button class="primary" id="btnNextRound" ${S.busy?"disabled":""}>Start round ${d.cr+2}</button></div>`:""}
    ${d.inGame&&final?`<div class="row"><button class="primary" id="btnNext" ${S.busy?"disabled":""}>Next category</button>${isHost?`<button id="btnEnd" ${S.busy?"disabled":""}>End game</button>`:""}</div><p class="note">Next up to set a category: ${esc(nickOf(d.order[(d.c+1)%d.n]))}.</p>`:""}
  </section>`;
}

function vStandings(d,final){
  const st = standings(d);
  if(!st.done.length) return "";
  return `<section class="panel">
    <div class="stack"><span class="eyebrow">${final?"Final standings":"Standings"}</span>${final&&st.rows[0]?`<h1>${esc(nickOf(st.rows[0].uid))} wins the game</h1>`:""}</div>
    <div style="overflow-x:auto"><table><thead><tr><th>Player</th><th class="r">Categories won</th><th class="r">Total counted</th></tr></thead>
    <tbody>${st.rows.map(r=>`<tr><td>${esc(nickOf(r.uid))}${r.uid===S.me?' <span class="muted small">you</span>':""}</td><td class="r num">${r.wins}</td><td class="r num">${fmt(r.total)}</td></tr>`).join("")}</tbody></table></div>
    <p class="note">${st.done.length} categor${st.done.length===1?"y":"ies"} played: ${st.done.map(x=>esc(x.text)).join(" · ")}</p>
    ${final?`<div class="row"><button id="btnLeave">Back to start</button></div>`:""}
  </section>`;
}

/* ---------- render ---------- */
function render(){
  // keep in-progress input values across re-renders
  const keep={}; let focusId=null, sel=null;
  $app.querySelectorAll("input[id],select[id]").forEach(el=>keep[el.id]=el.value);
  if(document.activeElement && document.activeElement.id){ focusId=document.activeElement.id; try{sel=[document.activeElement.selectionStart,document.activeElement.selectionEnd]}catch(e){} }

  let html="";
  if(!S.booted){ html = `<section class="panel"><h2>Loading the room…</h2><p class="muted">Connecting to the shared game board.</p></section>`; $bar.innerHTML=""; }
  else if(!S.db){ html = `<section class="panel"><h2>The shared game board isn't available here</h2><p class="muted">${S.why==="no-db"?"You don't seem to be signed in to Claude in this browser, or this app can't run shared pages. Open the link in a web browser while signed in.":"Claude can't tell who you are on this page. That happens when the page was opened through a public link. Ask the owner to invite your Claude account's email from the page's Share menu, then open the invite while signed in to that account."}</p><p class="note">Code: ${esc(S.why||"unknown")}</p></section>`; $bar.innerHTML=""; }
  else if(!S.code && S.connecting){ html = `<section class="panel"><h2>Joining room ${esc(S.connecting)}…</h2><p class="muted">Connecting to the host's browser. This can take up to half a minute.</p></section>`; $bar.innerHTML=""; }
  else if(!S.code){ html = vEntry(); $bar.innerHTML=""; }
  else if(!S.ready){ html = `<section class="panel"><h2>Opening room ${esc(S.code)}…</h2></section>`; }
  else if(!S.game){ html = `<section class="panel"><h2>Room ${esc(S.code)} doesn't exist</h2><div class="row"><button id="btnLeave">Back to start</button></div></section>`; }
  else{
    const d = derive();
    const amMember = S.members.some(m=>m.uid===S.me);
    $bar.innerHTML = `<div class="row">${NET.status?`<span class="pill zero">${esc(NET.status)}</span>`:(NET.host?`<span class="pill">Hosting · keep open</span>`:"")}<span class="code">${esc(S.code)}</span><button class="small" id="btnLeaveBar">${NET.host?"Close room":"Leave"}</button></div>`;
    if(!amMember){
      html = `<section class="panel"><h2>Join room ${esc(S.code)}</h2><label for="nick">Your name<input id="nick" maxlength="24" value="${esc(ls.get("sd-nick")||"")}"></label><div class="row"><button class="primary" id="btnJoinHere" ${S.busy?"disabled":""}>Join</button></div>${S.msg?`<p class="err">${esc(S.msg)}</p>`:""}</section>`;
    } else {
      const spect = d.phase!=="lobby" && d.phase!=="ended" && !d.inGame ? `<section class="panel"><p class="muted">The game started before you joined. You're watching; the host can add you before the next category.</p></section>` : "";
      if(d.phase==="lobby") html = vLobby(d);
      else if(d.phase==="setting") html = spect + vSetting(d) + vStandings(d);
      else if(d.phase==="drafting") html = spect + vDrafting(d) + vStandings(d);
      else if(d.phase==="review") html = spect + vReview(d) + vStandings(d);
      else if(d.phase==="reveal"||d.phase==="roundReveal") html = spect + vReveal(d) + vStandings(d);
      else if(d.phase==="ended") html = vStandings(d,true) || `<section class="panel"><h2>Game over</h2><div class="row"><button id="btnLeave">Back to start</button></div></section>`;
      if(S.msg && d.phase!=="drafting") html += `<p class="err">${esc(S.msg)}</p>`;
    }
  }
  $app.innerHTML = html;

  Object.keys(keep).forEach(id=>{ const el=document.getElementById(id); if(el) el.value = keep[id]; });
  if(focusId){ const el=document.getElementById(focusId); if(el){ el.focus(); if(sel && el.setSelectionRange && sel[0]!=null){ try{el.setSelectionRange(sel[0],sel[1])}catch(e){} } } }
  wire();
}

/* ---------- event wiring ---------- */
function on(id,fn){ const el=document.getElementById(id); if(el) el.onclick=fn; }
function nickVal(){ const v=(document.getElementById("nick")||{}).value||""; return v.trim(); }

function wire(){
  on("btnCreate",()=>{ const n=nickVal(); if(!n){S.msg="Enter your name first.";return render();} act(()=>createRoom(n)); });
  on("btnJoin",()=>{ const n=nickVal(), c=(document.getElementById("joinCode").value||"").trim(); if(!n){S.msg="Enter your name first.";return render();} if(c.length!==4){S.msg="Room codes are 4 letters.";return render();} act(()=>joinRoom(c,n)); });
  on("btnJoinHere",()=>{ const n=nickVal(); if(!n){S.msg="Enter your name first.";return render();} act(()=>joinRoom(S.code,n)); });
  on("btnLeave",leave); on("btnLeaveBar",leave);
  on("btnCopy",()=>{ const el=document.getElementById("inviteLink"); el.select(); try{ navigator.clipboard.writeText(el.value); }catch(e){ try{ document.execCommand("copy"); }catch(x){} } const b=document.getElementById("btnCopy"); if(b) b.textContent="Copied"; });
  const jc=document.getElementById("joinCode"); if(jc) jc.onkeydown=e=>{ if(e.key==="Enter") document.getElementById("btnJoin").click(); };

  on("btnStart",()=>act(async()=>{
    const order = S.members.slice().sort((a,b)=>a.joinedAt-b.joinedAt).map(m=>m.uid);
    await gameRef().update({status:"playing",order,cat:0,round:0,forceReveal:-1});
  }));
  on("btnAddLate",()=>act(async()=>{
    const add = S.members.filter(m=>!S.game.order.includes(m.uid)).sort((a,b)=>a.joinedAt-b.joinedAt).map(m=>m.uid);
    await gameRef().update({order:S.game.order.concat(add)});
  }));
  on("btnEnd",()=>act(async()=>{
    const d=derive();
    await gameRef().update({status:"ended",cat: d.phase==="reveal" ? (S.game.cat||0)+1 : (S.game.cat||0)});
  }));

  const metricSel=document.getElementById("catMetric");
  if(metricSel){ const sync=()=>{ document.getElementById("customWrap").hidden = metricSel.value!=="custom"; }; metricSel.onchange=sync; sync(); }
  on("btnRandom",()=>{
    const used = new Set(S.cats.map(x=>norm(x.text)));
    const left = POOL.filter(p=>!used.has(norm(p[0])));
    const pick = (left.length?left:POOL)[Math.floor(Math.random()*(left.length||POOL.length))];
    document.getElementById("catText").value=pick[0]; metricSel.value=pick[1]; metricSel.onchange();
  });
  on("btnSetCat",()=>{
    const text=document.getElementById("catText").value.trim(), metric=metricSel.value, rounds=parseInt(document.getElementById("catRounds").value,10);
    const customLabel=(document.getElementById("catCustom").value||"").trim();
    if(!text){S.msg="Write a category first.";return render();}
    if(metric==="custom"&&!customLabel){S.msg="Name the number you're scoring by.";return render();}
    const c=S.game.cat||0;
    act(()=>S.db.doc("cats/"+S.code+"_"+c).set({game:S.code,c,text,metric,customLabel,rounds,setter:S.me,at:Date.now()}));
  });

  const search=document.getElementById("pickSearch");
  if(search){
    let t=null;
    search.oninput=()=>{
      clearTimeout(t);
      const q=search.value, P=S.pick, m=derive().cat.metric;
      t=setTimeout(async()=>{
        P.q=q.trim(); P.err=""; P.sel=null;
        if(toks(q).filter(x=>x.length>=2).length===0){ P.results=[]; P.loading=false; return render(); }
        P.loading=true; render();
        try{ const res=await searchData(m,q); if(search.value!==q) return; P.results=res; }
        catch(e){ P.results=[]; P.err="The song data didn't load. Check your connection and try again."; }
        P.loading=false; render();
      },180);
    };
    search.onkeydown=e=>{ if(e.key==="Enter" && S.pick.results.length){ S.pick.sel=S.pick.results[0]; render(); } };
  }
  $app.querySelectorAll("[data-sel]").forEach(b=>b.onclick=()=>{ S.pick.sel=S.pick.results[parseInt(b.dataset.sel,10)]; S.msg=""; render(); });
  on("btnManual",()=>{ S.pick.manual=true; S.msg=""; render(); });
  on("btnBackToSearch",()=>{ S.pick.manual=false; S.msg=""; render(); });
  const ans=document.getElementById("pickAnswer"), sp=document.getElementById("spLink");
  if(ans && sp){ const upd=()=>{ sp.href="https://open.spotify.com/search/"+encodeURIComponent(ans.value.trim()); }; ans.oninput=upd; upd(); }
  if(document.getElementById("btnPick")){
    const go=()=>{
      const d=derive(); if(d.phase!=="drafting"||d.turn!==S.me) return;
      const P=S.pick; let rec;
      if(P.manual){
        const a=(document.getElementById("pickAnswer").value||"").trim(), v=parseNum(document.getElementById("pickValue").value);
        if(!a){S.msg="Type your pick.";return render();}
        if(v==null){S.msg="Enter the number as digits, like 1,234,567 or 1.2b.";return render();}
        rec={answer:a,value:v,ref:"",manual:d.cat.metric!=="custom"};
      } else {
        if(!P.sel){S.msg="Choose a result from the list.";return render();}
        rec={answer:P.sel.label+(P.sel.sub?" – "+P.sel.sub:""),value:P.sel.value,ref:P.sel.id,manual:false};
      }
      if(d.picks.some(p=>(rec.ref && p.ref===rec.ref) || norm(p.answer)===norm(rec.answer))){S.msg="Someone already picked that.";return render();}
      act(async()=>{
        await S.db.doc("picks/"+S.code+"_"+d.c+"_"+d.slot).set(Object.assign({game:S.code,cat:d.c,slot:d.slot,uid:S.me,at:Date.now()},rec));
        S.pick=null;
        ["pickSearch","pickAnswer","pickValue"].forEach(id=>{const el=document.getElementById(id); if(el) el.value="";});
      });
    };
    on("btnPick",go);
    const pv=document.getElementById("pickValue"); if(pv) pv.onkeydown=e=>{ if(e.key==="Enter") go(); };
  }
  on("btnUndo",()=>{ const d=derive(); const last=d.picks&&d.picks[d.picks.length-1]; if(!last||last.uid!==S.me) return; act(()=>S.db.doc("picks/"+last.id).delete()); });

  $app.querySelectorAll("[data-flag]").forEach(b=>b.onclick=()=>{
    const d=derive(), slot=parseInt(b.dataset.flag,10);
    const ref=S.db.doc("flags/"+S.code+"_"+d.c+"_"+slot+"_"+S.me);
    const mine=S.flags.some(f=>f.cat===d.c&&f.slot===slot&&f.uid===S.me);
    act(()=> mine ? ref.delete() : ref.set({game:S.code,cat:d.c,slot,uid:S.me}));
  });
  on("btnReviewed",()=>{ const d=derive(); act(()=>S.db.doc("reviews/"+S.code+"_"+d.c+"_"+d.cr+"_"+S.me).set({game:S.code,cat:d.c,round:d.cr,uid:S.me})); });
  on("btnForce",()=>{ const d=derive(); act(()=>gameRef().update({forceReveal:d.c+":"+d.cr})); });
  on("btnNext",()=>{ const d=derive(); if(d.phase!=="reveal") return; act(()=>gameRef().update({cat:d.c+1,round:0,forceReveal:-1})); });
  on("btnNextRound",()=>{ const d=derive(); if(d.phase!=="roundReveal") return; act(()=>gameRef().update({round:d.cr+1})); });
}

/* ---------- boot ---------- */
render();
dataMeta().then(render).catch(()=>{});
(()=>{
  let id = ls.get("sd-uid");
  if(!id){ id = "p-"+Math.random().toString(36).slice(2,12); ls.set("sd-uid",id); }
  S.me = id; S.db = netDb; S.booted = true;
  const h=(location.hash||"").slice(1).toUpperCase();
  if(/^[A-Z]{4}$/.test(h)){ if(ls.get("sd-room-"+h) || ls.get("sd-host-"+h)) resume(h); else autoJoin(h); }
  else render();
})();
window.addEventListener("hashchange",()=>{ const h=(location.hash||"").slice(1).toUpperCase(); if(/^[A-Z]{4}$/.test(h) && h!==S.code){ if(ls.get("sd-room-"+h) || ls.get("sd-host-"+h)) resume(h); else autoJoin(h); } });
})();
</script>
